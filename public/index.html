<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f3f3" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Classic Brick Game console in React — Tetris, Snake, Tank, Racing, Shooting, and Breakout with light and dark mode." />
    <meta name="keywords" content="Brick games, Tetris, Snake, Tank, Breakout, Racing, Game Boy, JavaScript, React" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>Brick Game</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('brick-theme');
          var mode = stored || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'dark' || (mode === 'system' && prefersDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
</body>

</html>
